<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Respawn legal</title>
<meta name="description" content="Rules of Play, Privacy Protocol, Terms and Subscription Terms for Respawn." />
<link rel="icon" href="/respawn/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0f16; --surface: #111827; --text: rgba(255,255,255,0.90);
    --accent: #257bf4; --label: #7aaef8; --link: #38bdf8;
    --border-soft: rgba(37,123,244,0.22);
    --pixel: 'Press Start 2P', system-ui, sans-serif;
    --mono: 'VT323', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 5rem; background: var(--bg); color: var(--text);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; }
  a { color: var(--link); }
  .back {
    font-family: var(--mono); font-size: 1.25rem; color: var(--label);
    text-decoration: none; display: inline-block; margin-bottom: 2rem;
  }
  .back:hover { color: var(--link); }
  h1 {
    font-family: var(--pixel); font-size: clamp(0.95rem, 3.4vw, 1.4rem);
    line-height: 1.5; color: #fff; margin: 0 0 0.75rem;
  }
  h2 {
    font-family: var(--mono); font-size: 1.5rem; letter-spacing: 0.02em;
    color: var(--label); margin: 2.5rem 0 0.5rem;
  }
  .updated {
    font-family: var(--mono); font-size: 1.15rem; color: var(--label);
    opacity: 0.75; margin: 0 0 2rem;
  }
  .intro {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 1rem 1.15rem;
  }
  p { margin: 0 0 1rem; }
  footer {
    margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border-soft);
    font-family: var(--mono); font-size: 1.1rem; color: var(--label); opacity: 0.7;
  }

  ul { list-style: none; padding: 0; margin: 2rem 0 0; }
  li { margin: 0 0 0.75rem; }
  li a {
    display: block; background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 0.9rem 1.15rem; text-decoration: none;
    font-family: var(--mono); font-size: 1.4rem; color: var(--link);
  }
  li a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="back" href="/respawn/">&lt; Respawn</a>
  <h1>Legal</h1>
  <p class="updated">The same text the app shows, published so it can be linked.</p>
  <ul>
    <li><a href="./rules.html">Rules of Play</a></li>
    <li><a href="./privacy.html">Privacy Protocol</a></li>
    <li><a href="./terms.html">Terms &amp; Conditions</a></li>
    <li><a href="./subscription.html">Subscription Terms</a></li>
  </ul>
  <footer>Respawn is operated by Akshansh Shrivastava and Somesh Bachani.</footer>
</main>
</body>
</html>
